<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>佑德随机闪卡</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;
          font-family:"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none}

/* 图片 */
#pic{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
     max-width:100vw;max-height:100vh;object-fit:contain;opacity:0;transition:opacity .35s ease}
#pic.show{opacity:1}

/* 底部计数器 */
#bar{position:fixed;bottom:0;left:0;right:0;height:40px;
     background:linear-gradient(transparent,rgba(0,0,0,.85));
     color:#ddd;font:14px/40px "PingFang SC","Microsoft YaHei",sans-serif;
     text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10}
#bar.on{opacity:1}

/* 开始 / 结束 遮罩层 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);
         display:flex;flex-direction:column;align-items:center;justify-content:center;
         z-index:20;transition:opacity .3s}
.overlay.hide{opacity:0;pointer-events:none}
.overlay h1{color:#fff;font-size:22px;margin-bottom:28px;text-align:center}
.overlay .sub{color:#888;font-size:13px;margin-top:10px}
.btn{padding:14px 48px;border-radius:28px;border:none;font-size:18px;font-weight:600;
     color:#fff;cursor:pointer;letter-spacing:2px;
     background:linear-gradient(135deg,#667eea,#764ba2)}
.btn:active{transform:scale(.96)}
.btn.done{background:linear-gradient(135deg,#f093fb,#f5576c)}

/* 左右翻页热区 */
.zone{position:fixed;top:0;bottom:0;width:35%;z-index:5;display:none}
.zone#leftZone{left:0}
.zone#rightZone{right:0}

/* 翻页提示箭头 */
.arrow{position:fixed;top:50%;transform:translateY(-50%);font-size:48px;color:rgba(255,255,255,.25);
       z-index:6;pointer-events:none;opacity:0;transition:opacity .2s}
#arrL{left:16px}
#arrR{right:16px}

/* 安装按钮 */
#installBtn{position:fixed;top:12px;right:12px;z-index:30;
            background:rgba(255,255,255,.12);color:#ccc;border:1px solid rgba(255,255,255,.25);
            padding:5px 12px;border-radius:16px;font-size:12px;display:none;cursor:pointer}
</style>
</head>
<body>

<!-- 开始界面 -->
<div id="startScreen" class="overlay">
  <h1>📷 佑德随机闪卡</h1>
  <button class="btn" id="startBtn">开始播放</button>
  <p class="sub" id="info"></p>
</div>

<!-- 结束界面 -->
<div id="endScreen" class="overlay hide">
  <h1>🎉 本轮播放完毕</h1>
  <button class="btn done" id="againBtn">再来一轮</button>
  <p class="sub">本轮共播放 <span id="played">0</span> 张图片</p>
</div>

<img id="pic" alt="">
<div id="bar"></div>

<!-- 左右翻页热区 + 箭头 -->
<div class="zone" id="leftZone"></div>
<div class="zone" id="rightZone"></div>
<div class="arrow" id="arrL">‹</div>
<div class="arrow" id="arrR">›</div>

<button id="installBtn">📲 安装到桌面</button>

<script>
/* ==================== 只改这里 ==================== */
const TOTAL = 72;   // ★图片总张数（必须与实际一致）
/* ================================================= */

// 生成文件列表：images/img (1).jpg ~ images/img (72).jpg
function buildFiles(){
  const arr = [];
  for(let n = 1; n <= TOTAL; n++){
    arr.push(encodeURI("images/img (" + n + ").jpg"));
  }
  return arr;
}

// Fisher-Yates 真随机洗牌
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let order=[], idx=0;
const pic=document.getElementById('pic');
const bar=document.getElementById('bar');
const startScr=document.getElementById('startScreen');
const endScr=document.getElementById('endScreen');
const playedSpan=document.getElementById('played');
const info=document.getElementById('info');
const leftZone=document.getElementById('leftZone');
const rightZone=document.getElementById('rightZone');
const arrL=document.getElementById('arrL');
const arrR=document.getElementById('arrR');

info.textContent = "共 "+TOTAL+" 张 · 左右滑动或点两侧翻页";

/* ---------- 开始一轮 ---------- */
function startRound(){
  startScr.classList.add('hide');
  endScr.classList.add('hide');
  order = shuffle(buildFiles());   // 每次全部重新打乱
  idx = 0;
  showPic();
  leftZone.style.display='block';
  rightZone.style.display='block';
}

/* ---------- 显示当前张 ---------- */
function showPic(){
  pic.classList.remove('show');
  setTimeout(()=>{
    pic.src = order[idx];
    pic.onload = ()=> pic.classList.add('show');
    pic.onerror = ()=>{
      // 坏图自动跳过，但保留 idx 逻辑
      if(idx < order.length - 1){ idx++; showPic(); }
      else { pic.classList.add('show'); }
    };
    bar.textContent = (idx+1)+' / '+order.length;
    bar.classList.add('on'); setTimeout(()=> bar.classList.remove('on'), 1200);
  }, 320);
}

/* ---------- 翻页 ---------- */
function goNext(){
  if(idx < order.length - 1){ idx++; showPic(); }
  else finish();
}
function goPrev(){
  if(idx > 0){ idx--; showPic(); }
}

/* ---------- 播放结束 ---------- */
function finish(){
  leftZone.style.display='none';
  rightZone.style.display='none';
  playedSpan.textContent = order.length;
  endScr.classList.remove('hide');
}

/* ---------- 左右点击 ---------- */
leftZone.addEventListener('click', ()=>{ goPrev(); flash(arrL); });
rightZone.addEventListener('click', ()=>{ goNext(); flash(arrR); });

function flash(el){ el.style.opacity='1'; setTimeout(()=>el.style.opacity='0',180); }

/* ---------- 左右滑动 ---------- */
let sx=0, sy=0;
document.addEventListener('touchstart', e=>{
  sx=e.touches[0].clientX; sy=e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX - sx;
  const dy=e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) < 50 || Math.abs(dx) <= Math.abs(dy)) return; // 忽略短滑 / 竖向滑
  if(dx < 0){ goNext(); flash(arrR); }   // 左滑 → 下一张
  else      { goPrev(); flash(arrL); }   // 右滑 → 上一张
}, {passive:true});

/* ---------- 按钮绑定 ---------- */
document.getElementById('startBtn').addEventListener('click', startRound);
document.getElementById('againBtn').addEventListener('click', startRound);

/* ---------- 保持屏幕常亮 ---------- */
let wakeLock=null;
async function keepAwake(){
  try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') keepAwake();
});
document.addEventListener('click', keepAwake, {once:true});

/* ---------- PWA 安装按钮 ---------- */
let deferredPrompt=null;
const instBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferredPrompt=e; instBtn.style.display='block';
});
instBtn.addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const r=await deferredPrompt.userChoice;
  if(r.outcome==='accepted') instBtn.style.display='none';
  deferredPrompt=null;
});
window.addEventListener('appinstalled', ()=>{ instBtn.style.display='none'; });

/* ---------- 注册 Service Worker ---------- */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
    .then(reg => {
      // 每次打开都主动触发一次更新检查
      reg.update();
      // 监听 SW 切换，切换后自动刷新页面
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
      });
    });
}
</script>
</body>
</html>
